# ---------------------------------------------------------------- Launch options

[[finding]]
group = """Launch options"""
base = """0x8200F000-0x82010DA0, sub_824F8150, sub_82C096E0, sub_82C09468"""
name = """launch-option table"""
what = """About 300 developer option names. `sub_824F8150`, slot 5 of the options object's vtable, is a per-token visitor: it offers one token to the matcher `sub_82C096E0` for each option (about 246 calls). A bare name toggles the option's byte flag and `name=true` or `name=1` sets it; `sub_82C09468` also takes part in matching `name=value` tokens. The names cover race setup (`launch`, `trackname`, `numlaps`, `numaicars`, `aiskill`, `timeofdayindex`, `numtrafficcars`), convenience (`skiptutorials`, `allowskipvoiceover`, `disablesplashintro`, `nohud`, `hidecockpitglass`, `NoHandOfGodReset`), restrictions (`eventrestrictions`, `showallcars`), photo mode, modes (`splitscreenlaunch`, `MultiscreenView`), debug menus (`forceEnableDebugMenus`, `debugmenudescriptions`) and performance (`highrescubemap`, `frontend30fps`, `mainthread30fps`, `framesperrender`, `maxaicars`, at `0x82010A2C`-`0x82010D84`)."""
how = """String xrefs; the visitor and matchers read in the generated code."""
confidence = """confirmed"""
source = """docs/REVERSE_ENGINEERING.md@a72a92a5f215 Developer options and leftover systems; docs/NATIVE_PORT_BACKLOG.md NP-8.1"""

