[[finding]]
group = """Analysis notes"""
name = """XER and CTR never cross a call"""
what = """No overflow-enabled (`o`-form) integer instruction exists in the image, and its one `mtxer` sits in a context-restore sequence, so the summary-overflow bit is never set by computation and the copy of it into every compare's condition field (192,632 compares) is always zero. The count register is written at 53,337 sites and read by 4,666 `bdnz` loops. Both registers are volatile in the PowerPC ABI, so the generated code keeps them in zero-initialized locals that never touch the register file (`ctr_as_local`, `xer_as_local`)."""
how = """Instruction counts over the generated tree."""
confidence = """confirmed"""
source = """docs/NEXT_LEVEL_RESEARCH.md NL-1.3; config/rexglue/analysis/main-xex.toml"""

