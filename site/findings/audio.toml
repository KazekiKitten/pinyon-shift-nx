what = """FMOD mixes in 5.1 because the title keeps FMOD's defaults. The system constructor `sub_82F90A00` stores the float output format (5) at +1184, speaker mode 5 (5.1) at +22064 and six output channels at +1200. The internal speaker-mode setter `sub_82F904E8` (modes 1-6 give 1, 2, 4, 5, 6 and 8 channels; it refuses once the system is initialised) is called only from its public wrapper `sub_82F86298`, which never runs, startup included. The title's `System::init` wrapper `sub_82F86498` calls FMOD's init `sub_82F96658` once, which passes the +1200 count to the Xenon output init (`sub_83000130` > `sub_82FFFC38`); that builds both the mastering voice and the source voice with it, so nothing else hard-codes six channels. The DTS Neural 7.1 branch `sub_82F8F8F0` never runs. Every FSB sample is mono or stereo (16,068 and 3,197 in 984 banks), so the six-channel width comes only from the bus format: ParamEQ, echo `sub_82FCD580` and the highpass/lowpass unit `sub_82FCEAB0` each spend about 98 % of their Odin time in their six-channel loops, and the host then folds the mix to stereo on Android. A `Stereo`/`PL2Stereo`/`5.1PCM` name table in the data has no code references."""
