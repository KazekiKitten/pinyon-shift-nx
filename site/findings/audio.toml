[[finding]]
group = """Audio engine"""
base = """sub_82FA84E8, sub_830072D0"""
name = """FMOD channel settings race"""
what = """Cue cleanup `sub_82FA84E8` clears a channel's shared-settings pointer, and the channel-settings update `sub_830072D0` reads that pointer repeatedly. Cleanup on a thread other than the audio thread can crash the update with a null read at `0x38`, so cue work belongs in `CAudioEngine::Update`."""
how = """Crash report and read-only thread trace; moving the cue work into `CAudioEngine::Update` removed the fault in later runs."""
confidence = """probable"""
note = """The crash was intermittent; the thread mismatch was observed."""
source = """docs/DLC_BACKLOG.md Saved-garage stage-three finish; Rally audio update ownership"""

