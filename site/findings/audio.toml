what = """Every access to the XMA register window (`0x7FEAxxxx`) is in nine small XDK routines, the XMA helpers that FMOD's XMA codec calls (see "FMOD XMA codec"); the title's own code never touches the hardware. Four write a register whose address and value arrive in r4 and r5 (`sub_830A42E0`, `sub_830A40F8`, `sub_830A3EF8`) or in r7/r8 and r10/r30 (`sub_830A4868`, two stores), two read one (`sub_830A4190` reads a word and a halfword at +80 of the register block, `sub_830A3E28` one word), and the three `sub_830B5xxx` routines are off the race path. Over one 12,993-frame race the writers ran 249,317, 249,238, 249,238 and 956 times and the reader 249,238 times: about 1.0 million register writes and 0.5 million reads, 77 and 38 a frame. In the recompiled build the store is not a trap: the generator recognised the window from the address construction and emits the store as a direct call into the decoder's register handler, so what the FMOD mixer thread pays for is the handler's work, which decodes the kicked context on the calling thread, not the dispatch."""
