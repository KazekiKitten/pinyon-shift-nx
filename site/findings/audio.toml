[[finding]]
group = """Radio banks and playlists"""
base = """FSB4 sample headers"""
v4 = """same"""
name = """FSB4 sample header layout"""
what = """An FSB4 bank is little-endian: a 48-byte header (`FSB4`, sample count, sample-header bytes, data bytes, version, mode, then a reserved field and hash), then one header per sample: u16 header size, a 30-byte name, length in samples, compressed bytes, loop start and end, mode and default frequency. The radio's samples carry an extra `SYNC` block after the first 80 bytes: a count and 260-byte markers (u32 position in samples, then a NUL-padded name), `SongStart`, `EventStart` and `IdentStart` for every sample. The audio data starts right after the sample headers, each sample aligned."""
how = """Parsed the shipped `Radio_Music.fsb` (127 samples) and rebuilt its header byte for byte with `tools/build-fh1-radio.py --check-bank`; the page's reader was run on the same bank."""
confidence = """confirmed"""
issue = """#420"""
source = """tools/build-fh1-radio.py read_bank"""

