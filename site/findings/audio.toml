# ---------------------------------------------------------------- Audio engine

[[finding]]
group = """Audio engine"""
base = """0x83439490, sub_82BADF40"""
v4 = """0x8352EA5C"""
name = """FMOD audio manager and cues"""
what = """The global at `0x83439490` is the audio manager (`IAudioManager`) over FMOD Ex events. Its vtable +280 loads an FMOD event project (`.fev`), +300 creates a named cue (group path, cue name) and +304 a programmer-sound cue that streams from an FSB. A cue's vtable +72 plays, +76 stops, +12 releases, and +84 and +88 report playing and channels; +36 is a legacy play (`sub_82BADF40`, with a report-missing flag and a subsample index)."""
how = """Loading the Rally co-driver bank and playing cues from the title's audio update through these methods; non-silent PCM captures."""
confidence = """confirmed"""
source = """src/pinyon_shift_runtime_hooks.cpp ProbeRallyAudio, ProbeRallyPace"""

