<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The renderer&#x27;s threads and what passes between them"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="40" width="140" height="76" rx="6" class="guest"/><text x="80.0" y="67.0" text-anchor="middle" class="t-head">Guest render thread</text><text x="80.0" y="82.0" text-anchor="middle" class="t-small">writes PM4 into</text><text x="80.0" y="97.0" text-anchor="middle" class="t-small">the ring buffer</text><rect x="170" y="40" width="140" height="76" rx="6" class="gpu"/><text x="240.0" y="67.0" text-anchor="middle" class="t-head">GPU Commands</text><text x="240.0" y="82.0" text-anchor="middle" class="t-small">decoder: shadow</text><text x="240.0" y="97.0" text-anchor="middle" class="t-small">registers, waits</text><rect x="330" y="40" width="140" height="76" rx="6" class="gpu"/><text x="400.0" y="67.0" text-anchor="middle" class="t-head">GPU Recorder</text><text x="400.0" y="82.0" text-anchor="middle" class="t-small">FH1 executor,</text><text x="400.0" y="97.0" text-anchor="middle" class="t-small">caches, recording</text><rect x="490" y="40" width="140" height="76" rx="6" class="gpu"/><text x="560.0" y="67.0" text-anchor="middle" class="t-head">GPU Submission</text><text x="560.0" y="82.0" text-anchor="middle" class="t-small">replays streams,</text><text x="560.0" y="97.0" text-anchor="middle" class="t-small">vkQueueSubmit</text><rect x="650" y="40" width="140" height="76" rx="6" class="host"/><text x="720.0" y="67.0" text-anchor="middle" class="t-head">Present</text><text x="720.0" y="82.0" text-anchor="middle" class="t-small">scaling, HDR,</text><text x="720.0" y="97.0" text-anchor="middle" class="t-small">swapchain</text><path d="M152 78 L168 78" class="edge" marker-end="url(#arrow)"/><text x="160.0" y="30" text-anchor="middle" class="t-small">packets</text><path d="M312 78 L328 78" class="edge" marker-end="url(#arrow)"/><text x="320.0" y="30" text-anchor="middle" class="t-small">RecordBatch</text><path d="M472 78 L488 78" class="edge" marker-end="url(#arrow)"/><text x="480.0" y="30" text-anchor="middle" class="t-small">deferred streams</text><path d="M632 78 L648 78" class="edge" marker-end="url(#arrow)"/><text x="640.0" y="30" text-anchor="middle" class="t-small">front buffer</text><path d="M400 118 L400 160 L80 160 L80 118" class="edge edge-dash" marker-end="url(#arrow)"/><text x="240" y="152" text-anchor="middle" class="t-small">fence writes become visible only after the recorder</text><rect x="170" y="190" width="300" height="120" rx="6" class="box"/><text x="320.0" y="216.5" text-anchor="middle" class="t-head">FH1 native executor (recorder thread)</text><text x="320.0" y="231.5" text-anchor="middle" class="t-small">EDRAM surfaces and a 2,048-tile owner map</text><text x="320.0" y="246.5" text-anchor="middle" class="t-small">clears folded into renderings</text><text x="320.0" y="261.5" text-anchor="middle" class="t-small">resolves into the guest-memory mirror</text><text x="320.0" y="276.5" text-anchor="middle" class="t-small">transfers between aliased surfaces</text><text x="320.0" y="291.5" text-anchor="middle" class="t-small">swap</text><rect x="490" y="190" width="300" height="120" rx="6" class="box"/><text x="640.0" y="216.5" text-anchor="middle" class="t-head">Recorder caches</text><text x="640.0" y="231.5" text-anchor="middle" class="t-small">pipelines from register state</text><text x="640.0" y="246.5" text-anchor="middle" class="t-small">textures decoded by compute</text><text x="640.0" y="261.5" text-anchor="middle" class="t-small">samplers and descriptor sets</text><text x="640.0" y="276.5" text-anchor="middle" class="t-small">system constants memo</text><text x="640.0" y="291.5" text-anchor="middle" class="t-small">about 1.1 µs of CPU per draw</text><path d="M400 116 L400 188" class="edge edge-dash"/></svg>
