<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-label="How render targets reach textures: EDRAM surfaces, resolves and the guest-memory mirror"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="20" y="40" width="210" height="96" rx="6" class="gpu"/><text x="125.0" y="69.5" text-anchor="middle" class="t-head">EDRAM surfaces</text><text x="125.0" y="84.5" text-anchor="middle" class="t-small">host images keyed by base tile,</text><text x="125.0" y="99.5" text-anchor="middle" class="t-small">pitch, MSAA, format;</text><text x="125.0" y="114.5" text-anchor="middle" class="t-small">scaled 1x to 4x</text><rect x="290" y="40" width="210" height="96" rx="6" class="gpu"/><text x="395.0" y="69.5" text-anchor="middle" class="t-head">Resolve (compute)</text><text x="395.0" y="84.5" text-anchor="middle" class="t-small">writes the guest&#x27;s tiled</text><text x="395.0" y="99.5" text-anchor="middle" class="t-small">texture layout; averages or</text><text x="395.0" y="114.5" text-anchor="middle" class="t-small">takes sample 0 for MSAA</text><rect x="560" y="40" width="200" height="96" rx="6" class="guest"/><text x="660.0" y="77.0" text-anchor="middle" class="t-head">Guest-memory mirror</text><text x="660.0" y="92.0" text-anchor="middle" class="t-small">range marked as</text><text x="660.0" y="107.0" text-anchor="middle" class="t-small">written by the GPU</text><rect x="20" y="220" width="210" height="96" rx="6" class="gpu"/><text x="125.0" y="257.0" text-anchor="middle" class="t-head">Draws</text><text x="125.0" y="272.0" text-anchor="middle" class="t-small">sample textures,</text><text x="125.0" y="287.0" text-anchor="middle" class="t-small">render into surfaces</text><rect x="290" y="220" width="210" height="96" rx="6" class="gpu"/><text x="395.0" y="249.5" text-anchor="middle" class="t-head">Texture cache</text><text x="395.0" y="264.5" text-anchor="middle" class="t-small">overlapping textures invalidated;</text><text x="395.0" y="279.5" text-anchor="middle" class="t-small">the next fetch untiles and</text><text x="395.0" y="294.5" text-anchor="middle" class="t-small">byte-swaps by compute</text><rect x="560" y="220" width="200" height="96" rx="6" class="guest"/><text x="660.0" y="249.5" text-anchor="middle" class="t-head">Guest RAM</text><text x="660.0" y="264.5" text-anchor="middle" class="t-small">one-off resolves of 256 KiB</text><text x="660.0" y="279.5" text-anchor="middle" class="t-small">or more, copied back for</text><text x="660.0" y="294.5" text-anchor="middle" class="t-small">the CPU (car thumbnails)</text><path d="M232 88 L288 88" class="edge" marker-end="url(#arrow)"/><path d="M502 88 L558 88" class="edge" marker-end="url(#arrow)"/><path d="M620 138 L620 178 L460 178 L460 218" class="edge" marker-end="url(#arrow)"/><text x="540" y="172" text-anchor="middle" class="t-small">invalidate</text><path d="M700 138 L700 218" class="edge edge-dash" marker-end="url(#arrow)"/><text x="706" y="182" text-anchor="start" class="t-small">readback</text><path d="M340 138 L340 218" class="edge edge-dash" marker-end="url(#arrow)"/><text x="346" y="182" text-anchor="start" class="t-small">direct store</text><path d="M288 268 L232 268" class="edge" marker-end="url(#arrow)"/><text x="260" y="260" text-anchor="middle" class="t-small">fetch</text><path d="M125 218 L125 138" class="edge" marker-end="url(#arrow)"/><text x="131" y="182" text-anchor="start" class="t-small">render</text><text x="390" y="344" text-anchor="middle" class="t-small">Transfers copy contents when a draw claims tiles another surface owns.</text></svg>
