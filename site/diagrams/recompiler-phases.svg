<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="The recompiler&#x27;s analysis phases, from loaded image to emitted C++"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="9" y="130" width="102" height="96" rx="6" class="box"/><text x="60.0" y="159.5" text-anchor="middle" class="t-head">Register</text><text x="60.0" y="174.5" text-anchor="middle" class="t-small">imports, .pdata,</text><text x="60.0" y="189.5" text-anchor="middle" class="t-small">save helpers,</text><text x="60.0" y="204.5" text-anchor="middle" class="t-small">EH tables</text><rect x="119" y="130" width="102" height="96" rx="6" class="box"/><text x="170.0" y="167.0" text-anchor="middle" class="t-head">Scan</text><text x="170.0" y="182.0" text-anchor="middle" class="t-small">code and data</text><text x="170.0" y="197.0" text-anchor="middle" class="t-small">regions</text><path d="M111 178 L118 178" class="edge" marker-end="url(#arrow)"/><rect x="229" y="130" width="102" height="96" rx="6" class="box"/><text x="280.0" y="159.5" text-anchor="middle" class="t-head">Discover</text><text x="280.0" y="174.5" text-anchor="middle" class="t-small">bl targets,</text><text x="280.0" y="189.5" text-anchor="middle" class="t-small">jump tables,</text><text x="280.0" y="204.5" text-anchor="middle" class="t-small">RTTI vtables</text><path d="M221 178 L228 178" class="edge" marker-end="url(#arrow)"/><rect x="339" y="130" width="102" height="96" rx="6" class="box"/><text x="390.0" y="159.5" text-anchor="middle" class="t-head">Gap fill</text><text x="390.0" y="174.5" text-anchor="middle" class="t-small">split leftovers</text><text x="390.0" y="189.5" text-anchor="middle" class="t-small">at blr and</text><text x="390.0" y="204.5" text-anchor="middle" class="t-small">tail calls</text><path d="M331 178 L338 178" class="edge" marker-end="url(#arrow)"/><rect x="449" y="130" width="102" height="96" rx="6" class="box"/><text x="500.0" y="167.0" text-anchor="middle" class="t-head">Merge</text><text x="500.0" y="182.0" text-anchor="middle" class="t-small">resolve jumps,</text><text x="500.0" y="197.0" text-anchor="middle" class="t-small">seal functions</text><path d="M441 178 L448 178" class="edge" marker-end="url(#arrow)"/><rect x="559" y="130" width="102" height="96" rx="6" class="box"/><text x="610.0" y="159.5" text-anchor="middle" class="t-head">Validate</text><text x="610.0" y="174.5" text-anchor="middle" class="t-small">every call must</text><text x="610.0" y="189.5" text-anchor="middle" class="t-small">land on a</text><text x="610.0" y="204.5" text-anchor="middle" class="t-small">function</text><path d="M551 178 L558 178" class="edge" marker-end="url(#arrow)"/><rect x="669" y="130" width="102" height="96" rx="6" class="host"/><text x="720.0" y="159.5" text-anchor="middle" class="t-head">Emit</text><text x="720.0" y="174.5" text-anchor="middle" class="t-small">C++ per</text><text x="720.0" y="189.5" text-anchor="middle" class="t-small">function,</text><text x="720.0" y="204.5" text-anchor="middle" class="t-small">1 MiB files</text><path d="M661 178 L668 178" class="edge" marker-end="url(#arrow)"/><rect x="15" y="20" width="314" height="66" rx="6" class="guest"/><text x="172.0" y="42.0" text-anchor="middle" class="t-head">Analysis TOML per image</text><text x="172.0" y="57.0" text-anchor="middle" class="t-small">113 function boundaries, switch tables,</text><text x="172.0" y="72.0" text-anchor="middle" class="t-small">130 mid-asm hooks, setjmp/longjmp</text><rect x="451" y="20" width="314" height="66" rx="6" class="guest"/><text x="608.0" y="42.0" text-anchor="middle" class="t-head">Accepted warnings</text><text x="608.0" y="57.0" text-anchor="middle" class="t-small">any new codegen warning</text><text x="608.0" y="72.0" text-anchor="middle" class="t-small">fails the build</text><path d="M120 88 L120 128" class="edge" marker-end="url(#arrow)"/><path d="M229 88 L229 128" class="edge" marker-end="url(#arrow)"/><path d="M608 88 L608 128" class="edge" marker-end="url(#arrow)"/><text x="390" y="262" text-anchor="middle" class="t-small">Discovery that contradicts a declared size warns; an unresolved call is an error.</text></svg>
