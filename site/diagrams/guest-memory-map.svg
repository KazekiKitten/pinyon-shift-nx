<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-label="The guest&#x27;s 4 GB address space and its three views of one physical heap"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="110" y="20" width="260" height="96" class="box"/><text x="102" y="32" text-anchor="end" class="t-small t-mono">0x00000000</text><text x="240" y="72.0" text-anchor="middle" class="t-head">Virtual, 4 KB pages</text><rect x="110" y="116" width="260" height="96" class="box"/><text x="102" y="128" text-anchor="end" class="t-small t-mono">0x40000000</text><text x="240" y="164.0" text-anchor="middle" class="t-head">Virtual, 64 KB pages</text><text x="240" y="180.0" text-anchor="middle" class="t-small">guest stacks at 0x70000000, MMIO at 0x7F000000</text><rect x="110" y="212" width="260" height="24" class="guest"/><text x="102" y="224" text-anchor="end" class="t-small t-mono">0x80000000</text><text x="240" y="228.0" text-anchor="middle" class="t-head">XEX image, 64 KB pages</text><rect x="110" y="236" width="260" height="24" class="guest"/><text x="102" y="248" text-anchor="end" class="t-small t-mono">0x90000000</text><text x="240" y="252.0" text-anchor="middle" class="t-head">XEX image, 4 KB pages</text><rect x="110" y="260" width="260" height="48" class="gpu"/><text x="102" y="272" text-anchor="end" class="t-small t-mono">0xA0000000</text><text x="240" y="288.0" text-anchor="middle" class="t-head">Physical, 64 KB pages</text><rect x="110" y="308" width="260" height="48" class="gpu"/><text x="102" y="320" text-anchor="end" class="t-small t-mono">0xC0000000</text><text x="240" y="336.0" text-anchor="middle" class="t-head">Physical, 16 MB pages</text><rect x="110" y="356" width="260" height="48" class="gpu"/><text x="102" y="368" text-anchor="end" class="t-small t-mono">0xE0000000</text><text x="240" y="380.0" text-anchor="middle" class="t-head">Physical, 4 KB pages</text><text x="240" y="396.0" text-anchor="middle" class="t-small">+0x1000 on hosts with pages over 4 KB</text><text x="102" y="408" text-anchor="end" class="t-small t-mono">0xFFFFFFFF</text><rect x="520" y="190" width="230" height="80" rx="6" class="gpu"/><text x="635.0" y="219.0" text-anchor="middle" class="t-head">512 MB physical heap</text><text x="635.0" y="234.0" text-anchor="middle" class="t-small">one allocation, three</text><text x="635.0" y="249.0" text-anchor="middle" class="t-small">page-size views</text><path d="M372 284.0 L450 284.0 L450 230 L518 230" class="edge" marker-end="url(#arrow)"/><path d="M372 332.0 L450 332.0 L450 230 L518 230" class="edge" marker-end="url(#arrow)"/><path d="M372 380.0 L450 380.0 L450 230 L518 230" class="edge" marker-end="url(#arrow)"/><rect x="520" y="40" width="230" height="92" rx="6" class="host"/><text x="635.0" y="67.5" text-anchor="middle" class="t-head">Host mapping</text><text x="635.0" y="82.5" text-anchor="middle" class="t-small">one 4.5 GB file mapping:</text><text x="635.0" y="97.5" text-anchor="middle" class="t-small">4 GB view + 512 MB physical;</text><text x="635.0" y="112.5" text-anchor="middle" class="t-small">host = base + guest address</text><rect x="520" y="320" width="230" height="76" rx="6" class="box"/><text x="635.0" y="347.0" text-anchor="middle" class="t-head">Byte order</text><text x="635.0" y="362.0" text-anchor="middle" class="t-small">guest memory stays</text><text x="635.0" y="377.0" text-anchor="middle" class="t-small">big-endian; every access swaps</text></svg>
