<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-label="From the disc to the screen: the build stages, then the running game"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="760" height="170" rx="8" class="lane"/><text x="22" y="30" text-anchor="start" class="t-lane">BUILD, ONCE, ON THE PLAYER&#x27;S MACHINE</text><rect x="24" y="60" width="132" height="80" rx="6" class="guest"/><text x="90.0" y="89.0" text-anchor="middle" class="t-head">Disc image</text><text x="90.0" y="104.0" text-anchor="middle" class="t-small">SHA-256 checked</text><text x="90.0" y="119.0" text-anchor="middle" class="t-small">read-only</text><rect x="174" y="60" width="132" height="80" rx="6" class="box"/><text x="240.0" y="89.0" text-anchor="middle" class="t-head">XEX loader</text><text x="240.0" y="104.0" text-anchor="middle" class="t-small">decrypt, decompress</text><text x="240.0" y="119.0" text-anchor="middle" class="t-small">3 executable images</text><rect x="324" y="60" width="132" height="80" rx="6" class="box"/><text x="390.0" y="89.0" text-anchor="middle" class="t-head">Analysis</text><text x="390.0" y="104.0" text-anchor="middle" class="t-small">functions, jump tables</text><text x="390.0" y="119.0" text-anchor="middle" class="t-small">hooks from TOML</text><rect x="474" y="60" width="132" height="80" rx="6" class="box"/><text x="540.0" y="89.0" text-anchor="middle" class="t-head">C++ emitter</text><text x="540.0" y="104.0" text-anchor="middle" class="t-small">one function each</text><text x="540.0" y="119.0" text-anchor="middle" class="t-small">~260 files, ~300 MB</text><rect x="624" y="60" width="132" height="80" rx="6" class="box"/><text x="690.0" y="89.0" text-anchor="middle" class="t-head">Clang 20.1.8</text><text x="690.0" y="104.0" text-anchor="middle" class="t-small">pinned toolchain</text><text x="690.0" y="119.0" text-anchor="middle" class="t-small">native executable</text><path d="M156 100 L172 100" class="edge" marker-end="url(#arrow)"/><path d="M306 100 L322 100" class="edge" marker-end="url(#arrow)"/><path d="M456 100 L472 100" class="edge" marker-end="url(#arrow)"/><path d="M606 100 L622 100" class="edge" marker-end="url(#arrow)"/><rect x="10" y="200" width="760" height="260" rx="8" class="lane"/><text x="22" y="220" text-anchor="start" class="t-lane">RUN</text><path d="M690 140 L690 185 L120 185 L120 238" class="edge" marker-end="url(#arrow)"/><rect x="30" y="240" width="180" height="76" rx="6" class="guest"/><text x="120.0" y="267.0" text-anchor="middle" class="t-head">Translated game code</text><text x="120.0" y="282.0" text-anchor="middle" class="t-small">PowerPC semantics in C++</text><text x="120.0" y="297.0" text-anchor="middle" class="t-small">~42 guest threads</text><rect x="300" y="240" width="180" height="76" rx="6" class="host"/><text x="390.0" y="267.0" text-anchor="middle" class="t-head">ShiftGlue runtime</text><text x="390.0" y="282.0" text-anchor="middle" class="t-small">kernel and XAM HLE, memory,</text><text x="390.0" y="297.0" text-anchor="middle" class="t-small">files, audio, input</text><rect x="570" y="240" width="180" height="76" rx="6" class="host"/><text x="660.0" y="267.0" text-anchor="middle" class="t-head">Host features</text><text x="660.0" y="282.0" text-anchor="middle" class="t-small">settings, saves, mods,</text><text x="660.0" y="297.0" text-anchor="middle" class="t-small">frame rate, camera</text><path d="M212 278 L298 278" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="255" y="270" text-anchor="middle" class="t-small">calls</text><path d="M482 278 L568 278" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="525" y="270" text-anchor="middle" class="t-small">hooks</text><rect x="30" y="360" width="180" height="76" rx="6" class="guest"/><text x="120.0" y="38